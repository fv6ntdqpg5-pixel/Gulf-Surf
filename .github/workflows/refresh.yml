name: Refresh surf data

on:
  schedule:
    - cron: '7 */2 * * *'    # every 2 hours, UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NOAA / NWS inputs
        run: python fetch_surf.py
      - name: Build data.js
        run: python build_surf.py
      - name: Commit if changed
        run: |
          git config user.name "surf-refresh"
          git config user.email "actions@github.com"
          git add data.js raw/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
